<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bengacoon — le bien-être, à votre rythme</title>

<link rel="icon" href="assets/bengacoon360.png">
<meta property="og:title" content="Bengacoon — le bien-être, à votre rythme">
<meta property="og:description" content="Dix compagnons pour prendre soin de soi au quotidien : pierres, souffle, émotions, mouvement, santé.">

<style>
  :root{
    --nuit:#2E2A47; --nuit-fonce:#211E36; --or:#C9A86A; --or-clair:#E3CB98;
    --creme:#F6F2E9; --creme-2:#EEE7D7; --texte:#2A2A28; --muted:#6E6A60;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--texte);background:var(--creme);line-height:1.6}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:20;background:rgba(246,242,233,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--creme-2)}
  header .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap}
  header .logo-link{display:flex;align-items:center;gap:12px;text-decoration:none}
  header img{width:36px;height:36px;border-radius:9px}
  header .brand{font-weight:800;font-size:19px}
  header .brand small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.3px}
  header nav{margin-left:auto;display:flex;gap:20px;font-size:14px;font-weight:600;flex-wrap:wrap;justify-content:flex-end}
  header nav a{color:var(--muted);text-decoration:none;white-space:nowrap}
  header nav a:hover{color:var(--nuit)}
  @media(max-width:640px){header .wrap{flex-direction:column;gap:8px;padding:10px 0;min-height:0}header .brand small{display:none}header nav{margin-left:0;justify-content:center;gap:12px 16px;font-size:13.5px}}

  .hero{background:linear-gradient(160deg,var(--nuit) 0%,var(--nuit-fonce) 100%);color:#fff;text-align:center;padding:74px 0 84px;position:relative;overflow:hidden}
  .hero .gem{position:absolute;opacity:.10;background:var(--or-clair);border-radius:50%;filter:blur(2px)}
  .hero .g1{width:220px;height:220px;top:-70px;left:-60px}
  .hero .g2{width:150px;height:150px;bottom:-50px;right:-30px}
  .hero .par{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--or);font-weight:700;margin-bottom:14px}
  .hero h1{font-size:clamp(29px,5vw,45px);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-bottom:16px;position:relative}
  .hero p{max-width:62ch;margin:0 auto;color:#E6E1D4;font-size:17px;position:relative}
  .hero .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;position:relative}
  .hero .chip{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}

  section{padding:58px 0}
  section.alt{background:var(--creme-2)}
  h2{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .h2sub{color:var(--muted);font-size:15px;margin-bottom:28px;max-width:70ch}

  .stack{display:flex;flex-direction:column;gap:20px}
  .app{display:grid;grid-template-columns:230px 1fr;background:#fff;border:1px solid var(--creme-2);border-radius:20px;overflow:hidden;position:relative}
  .app::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc,var(--or));z-index:2}
  .app.slim{grid-template-columns:180px 1fr}
  .app.slim .media .shot{width:126px}
  .app.slim .media.noshot .ico{width:88px;height:88px}
  @media(max-width:720px){.app,.app.slim{grid-template-columns:1fr}}

  .media{display:flex;align-items:center;justify-content:center;padding:26px 20px;background:linear-gradient(165deg,var(--creme) 0%,var(--creme-2) 100%);border-right:1px solid var(--creme-2)}
  @media(max-width:720px){.media{border-right:0;border-bottom:1px solid var(--creme-2);padding:24px}}
  .media .shot{width:170px;height:auto;border-radius:16px;border:1px solid rgba(46,42,71,.10);box-shadow:0 12px 30px rgba(46,42,71,.16);display:block}
  .media.noshot .ico{width:104px;height:104px;border-radius:24px;box-shadow:0 10px 26px rgba(46,42,71,.16);display:block}

  .body{padding:24px 26px 26px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .top .badge{width:34px;height:34px;border-radius:9px;flex:0 0 auto}
  .top h3{font-size:20px;font-weight:800;color:var(--nuit);line-height:1.2}
  .top .kind{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:1px}
  .tag{margin-left:auto;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
  .tag.free{background:#E7F2E9;border:1px solid #CFE4D4;color:#2C6B41}
  .tag.paid{background:#FBF2DE;border:1px solid #EEDFB8;color:#8A6A1E}
  .tag.soon{background:#EFEDF6;border:1px solid #DEDAEC;color:#514B78}
  .body > p{color:var(--muted);font-size:15px}
  .body > p strong{color:var(--texte)}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;border:1px solid var(--creme-2);border-radius:14px;overflow:hidden}
  @media(max-width:560px){.split{grid-template-columns:1fr}}
  .split .col{padding:15px 17px}
  .split .col+.col{border-left:1px solid var(--creme-2)}
  @media(max-width:560px){.split .col+.col{border-left:0;border-top:1px solid var(--creme-2)}}
  .split .col.prem{background:#FDFAF2}
  .split h4{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .split .col.prem h4{color:var(--acc,var(--or))}
  .split ul{list-style:none}
  .split li{position:relative;padding:3px 0 3px 19px;font-size:13.8px;color:var(--texte)}
  .split li::before{content:"·";position:absolute;left:5px;top:3px;color:var(--muted);font-weight:800}
  .split .col.prem li::before{content:"◆";left:0;font-size:9px;top:6px;color:var(--acc,var(--or))}

  .go{display:inline-block;margin-top:18px;font-size:14px;font-weight:800;color:var(--nuit);text-decoration:none;border-bottom:2px solid var(--acc,var(--or));padding-bottom:2px}
  .go:hover{color:var(--acc,var(--or))}

  .note{margin-top:26px;font-size:13.5px;color:var(--muted);background:#fff;border:1px solid var(--creme-2);border-radius:14px;padding:16px 18px}
  .note strong{color:var(--texte)}

  footer{background:var(--nuit);color:#D9D4C6;text-align:center;padding:40px 0;font-size:14px}
  footer a{color:var(--or-clair)}
  footer .disc{max-width:74ch;margin:14px auto 0;font-size:12.5px;color:#A9A497;line-height:1.55}

  /* Contact & assistance */
  .bgc-contact{padding:52px 0;border-top:1px solid rgba(128,128,128,.22)}
  .bgc-contact .bgc-box{max-width:640px;margin:0 auto;text-align:center;border:1px solid rgba(128,128,128,.28);border-radius:18px;padding:30px 26px;background:rgba(127,127,127,.05)}
  .bgc-contact h2{font-size:22px;font-weight:800;margin:0 0 8px;letter-spacing:normal;text-transform:none;color:var(--nuit)}
  .bgc-contact p{font-size:15px;line-height:1.6;margin:0 0 6px;opacity:.85;max-width:none}
  .bgc-contact p .k{font-weight:700;opacity:1;color:var(--texte)}
  .bgc-contact .bgc-mail{display:inline-block;margin-top:18px;padding:13px 26px;border-radius:999px;font-weight:800;font-size:15.5px;text-decoration:none;background:var(--or);color:#1B1B1B;border:1px solid rgba(0,0,0,.12)}
  .bgc-contact .bgc-mail:hover{filter:brightness(1.07)}
  .bgc-contact .bgc-addr{display:block;margin-top:11px;font-size:13px;opacity:.65}

  .hero2{padding:58px 0 64px}
  .hero2 h1{font-size:clamp(26px,4.2vw,38px)}
  .subhead{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--nuit);margin:34px 0 6px}
  .subhead:first-of-type{margin-top:10px}
  #gm-lang{background:transparent;border:1px solid var(--creme-2);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;margin-left:6px}
</style>
</head>

<script>(function(){
var T={"fr":{"h":"Une question ? Un souci ? Une idée ?","p1":"Écrivez-nous : chaque message est lu. Dites-nous simplement de quelle application vous parlez — ici {app}, c'est déjà noté pour vous.","p1h":"Écrivez-nous : chaque message est lu. Dites-nous simplement de quelle application vous parlez — la première ligne du message est prévue pour ça.","p2":"Et précisez si c'est un renseignement, un bug qui vous embête, ou une idée de fonctionnalité — les meilleures viennent souvent de vous.","btn":"✉️ Nous écrire","body":"Application : {app}\nType de demande : renseignement / bug / idée de fonctionnalité\n\nVotre message :\n"},"en":{"h":"A question? A problem? An idea?","p1":"Write to us — every message is read. Just tell us which app you mean; here it's {app}, already filled in for you.","p1h":"Write to us — every message is read. Just tell us which app you mean; the first line of the message is there for that.","p2":"And let us know whether it's a question, a bug that's bothering you, or an idea for a new feature — the best ones often come from you.","btn":"✉️ Write to us","body":"App: {app}\nType of request: question / bug / feature idea\n\nYour message:\n"},"de":{"h":"Eine Frage? Ein Problem? Eine Idee?","p1":"Schreiben Sie uns — jede Nachricht wird gelesen. Sagen Sie uns einfach, um welche App es geht; hier {app}, schon für Sie eingetragen.","p1h":"Schreiben Sie uns — jede Nachricht wird gelesen. Sagen Sie uns einfach, um welche App es geht; die erste Zeile ist dafür vorgesehen.","p2":"Und sagen Sie uns, ob es eine Frage, ein störender Fehler oder eine Idee für eine neue Funktion ist — die besten kommen oft von Ihnen.","btn":"✉️ Schreiben Sie uns","body":"App: {app}\nArt der Anfrage: Frage / Fehler / Funktionsidee\n\nIhre Nachricht:\n"},"it":{"h":"Una domanda? Un problema? Un'idea?","p1":"Scriveteci: leggiamo ogni messaggio. Indicateci solo di quale app si tratta; qui {app}, già inserita per voi.","p1h":"Scriveteci: leggiamo ogni messaggio. Indicateci solo di quale app si tratta: la prima riga del messaggio serve a questo.","p2":"E precisate se è un'informazione, un bug che vi dà fastidio o un'idea per una nuova funzione — le migliori vengono spesso da voi.","btn":"✉️ Scriveteci","body":"App: {app}\nTipo di richiesta: informazione / bug / idea di funzione\n\nIl vostro messaggio:\n"},"pt":{"h":"Uma dúvida? Um problema? Uma ideia?","p1":"Escreva-nos: lemos todas as mensagens. Basta dizer de que aplicação se trata; aqui {app}, já preenchido para si.","p1h":"Escreva-nos: lemos todas as mensagens. Basta dizer de que aplicação se trata — a primeira linha da mensagem serve para isso.","p2":"E diga-nos se é uma dúvida, um erro que o incomoda ou uma ideia de funcionalidade — as melhores vêm muitas vezes de si.","btn":"✉️ Escreva-nos","body":"Aplicação: {app}\nTipo de pedido: dúvida / erro / ideia de funcionalidade\n\nA sua mensagem:\n"},"es":{"h":"¿Una duda? ¿Un problema? ¿Una idea?","p1":"Escríbanos: leemos todos los mensajes. Solo díganos de qué aplicación se trata; aquí {app}, ya rellenado por usted.","p1h":"Escríbanos: leemos todos los mensajes. Solo díganos de qué aplicación se trata — la primera línea del mensaje es para eso.","p2":"Y precise si es una consulta, un error que le molesta o una idea de función — las mejores suelen venir de ustedes.","btn":"✉️ Escríbanos","body":"Aplicación: {app}\nTipo de solicitud: consulta / error / idea de función\n\nSu mensaje:\n"},"sv":{"h":"En fråga? Ett problem? En idé?","p1":"Skriv till oss — vi läser varje meddelande. Berätta bara vilken app det gäller; här {app}, redan ifyllt åt dig.","p1h":"Skriv till oss — vi läser varje meddelande. Berätta bara vilken app det gäller: första raden är till för det.","p2":"Och berätta om det är en fråga, ett fel som stör dig eller en idé till en ny funktion — de bästa kommer ofta från dig.","btn":"✉️ Skriv till oss","body":"App: {app}\nTyp av ärende: fråga / fel / funktionsidé\n\nDitt meddelande:\n"},"no":{"h":"Et spørsmål? Et problem? En idé?","p1":"Skriv til oss — vi leser hver melding. Fortell oss bare hvilken app det gjelder; her {app}, allerede fylt ut for deg.","p1h":"Skriv til oss — vi leser hver melding. Fortell oss bare hvilken app det gjelder: den første linjen er til det.","p2":"Og si om det er et spørsmål, en feil som plager deg, eller en idé til en ny funksjon — de beste kommer ofte fra deg.","btn":"✉️ Skriv til oss","body":"App: {app}\nType henvendelse: spørsmål / feil / funksjonsidé\n\nDin melding:\n"},"fi":{"h":"Kysymys? Ongelma? Idea?","p1":"Kirjoita meille — luemme jokaisen viestin. Kerro vain, mistä sovelluksesta on kyse; tässä {app}, valmiiksi täytettynä.","p1h":"Kirjoita meille — luemme jokaisen viestin. Kerro vain, mistä sovelluksesta on kyse: viestin ensimmäinen rivi on sitä varten.","p2":"Ja kerro, onko kyseessä kysymys, häiritsevä virhe vai idea uudesta ominaisuudesta — parhaat tulevat usein teiltä.","btn":"✉️ Kirjoita meille","body":"Sovellus: {app}\nPyynnön tyyppi: kysymys / virhe / ominaisuusidea\n\nViestisi:\n"}};
var APP="";
var KEY="";

 v=v||document.documentElement.lang||(navigator.language||"fr");v=String(v).slice(0,2).toLowerCase();
 if(v==="nb"||v==="nn")v="no"; return T[v]?v:"fr";}
function draw(){var t=T[lang()],b=document.getElementById("bgc-contact");if(!b)return;

<script>(function(){
var T={"homecoon.genre":{"fr":"Inventaire de la maison","en":"Home inventory","de":"Hausinventar","it":"Inventario di casa","pt":"Inventário da casa","es":"Inventario de la casa","sv":"Hemmets inventarium","no":"Hjemmets inventar","fi":"Kodin varasto"},"homecoon.desc":{"fr":"Répertoriez ce qui dort dans le garage, la cave, les placards et les cartons — puis retrouvez n'importe quoi avec son <b>chemin exact</b> : « Garage › Zone B › Étagère 2 › Bac B4 ». Un QR collé sur chaque bac ouvre son contenu d'un scan, et l'étiquette reste valable même si vous renommez ou déplacez le bac. Outillage, visserie, cave à vin, garde-manger, affaires des animaux. <b>Tout reste sur votre téléphone</b>, et l'application répond au fond du garage, sans réseau.","en":"List what sleeps in the garage, the cellar, the cupboards and the boxes — then find anything by its <b>exact path</b>: “Garage › Zone B › Shelf 2 › Bin B4”. A QR code stuck on each bin opens its contents in one scan, and the label stays valid even if you rename or move the bin. Tools, fasteners, wine cellar, pantry, pet supplies. <b>Everything stays on your phone</b>, and the app answers at the back of the garage, with no network.","de":"Erfassen Sie, was in Garage, Keller, Schränken und Kartons schlummert — und finden Sie alles über seinen <b>genauen Pfad</b> wieder: „Garage › Zone B › Regal 2 › Kiste B4“. Ein QR-Code auf jeder Kiste öffnet ihren Inhalt mit einem Scan, und das Etikett bleibt gültig, auch wenn Sie die Kiste umbenennen oder verschieben. Werkzeug, Schrauben, Weinkeller, Vorratskammer, Tierbedarf. <b>Alles bleibt auf Ihrem Telefon</b>, und die App antwortet hinten in der Garage, ganz ohne Netz.","it":"Cataloga ciò che dorme in garage, in cantina, negli armadi e negli scatoloni — poi ritrova qualsiasi cosa con il suo <b>percorso esatto</b>: « Garage › Zona B › Scaffale 2 › Contenitore B4 ». Un QR attaccato su ogni contenitore ne apre il contenuto con una scansione, e l'etichetta resta valida anche se lo rinomini o lo sposti. Utensili, viteria, cantina, dispensa, cose degli animali. <b>Tutto resta sul telefono</b>, e l'app risponde in fondo al garage, senza rete.","pt":"Catalogue o que dorme na garagem, na cave, nos armários e nas caixas — e encontre qualquer coisa pelo seu <b>caminho exato</b>: «Garagem › Zona B › Prateleira 2 › Caixote B4». Um QR colado em cada caixote abre o seu conteúdo com uma leitura, e a etiqueta continua válida mesmo que mude o nome ou o lugar. Ferramentas, parafusos, garrafeira, despensa, coisas dos animais. <b>Tudo fica no seu telemóvel</b>, e a app responde ao fundo da garagem, sem rede.","es":"Cataloga lo que duerme en el garaje, la bodega, los armarios y las cajas — y encuentra cualquier cosa por su <b>ruta exacta</b>: «Garaje › Zona B › Estante 2 › Caja B4». Un QR pegado en cada caja abre su contenido de un escaneo, y la etiqueta sigue valiendo aunque la renombres o la muevas. Herramientas, tornillería, bodega, despensa, cosas de los animales. <b>Todo se queda en tu teléfono</b>, y la app responde al fondo del garaje, sin red.","sv":"Registrera det som sover i garaget, källaren, skåpen och kartongerna — och hitta sedan vad som helst via dess <b>exakta sökväg</b>: ”Garage › Zon B › Hylla 2 › Låda B4”. En QR-kod på varje låda öppnar innehållet med en skanning, och etiketten gäller även om du byter namn på lådan eller flyttar den. Verktyg, skruv, vinkällare, skafferi, djurens saker. <b>Allt stannar i telefonen</b>, och appen svarar längst in i garaget, utan nät.","no":"Registrer det som sover i garasjen, kjelleren, skapene og kassene — og finn så hva som helst via <b>nøyaktig sti</b>: «Garasje › Sone B › Hylle 2 › Kasse B4». En QR-kode på hver kasse åpner innholdet med én skanning, og etiketten gjelder selv om du gir kassen nytt navn eller flytter den. Verktøy, skruer, vinkjeller, spiskammer, dyrenes utstyr. <b>Alt blir liggende på telefonen</b>, og appen svarer innerst i garasjen, uten nett.","fi":"Luetteloi se, mikä nukkuu autotallissa, kellarissa, kaapeissa ja laatikoissa — ja löydä mikä tahansa sen <b>tarkan polun</b> avulla: ”Autotalli › Alue B › Hylly 2 › Laatikko B4”. Jokaiseen laatikkoon liimattu QR-koodi avaa sen sisällön yhdellä skannauksella, ja tarra pysyy voimassa vaikka nimeäisit laatikon uudelleen tai siirtäisit sen. Työkalut, ruuvit, viinikellari, ruokakomero, lemmikkien tarvikkeet. <b>Kaikki pysyy puhelimessasi</b>, ja sovellus vastaa autotallin perällä ilman verkkoa."},"homecoon.free0":{"fr":"50 objets et lieux enregistrés","en":"50 items and places stored","de":"50 gespeicherte Objekte und Orte","it":"50 oggetti e luoghi registrati","pt":"50 objetos e locais guardados","es":"50 objetos y lugares guardados","sv":"50 sparade föremål och platser","no":"50 lagrede gjenstander og steder","fi":"50 tallennettua esinettä ja paikkaa"},"homecoon.free1":{"fr":"Lieux, photos, recherche, QR et scanner","en":"Places, photos, search, QR codes and scanner","de":"Orte, Fotos, Suche, QR-Codes und Scanner","it":"Luoghi, foto, ricerca, QR e scanner","pt":"Locais, fotos, pesquisa, QR e leitor","es":"Lugares, fotos, búsqueda, QR y escáner","sv":"Platser, foton, sök, QR och skanner","no":"Steder, bilder, søk, QR og skanner","fi":"Paikat, kuvat, haku, QR ja skanneri"},"homecoon.free2":{"fr":"Sauvegarde de vos données","en":"Backup of your data","de":"Sicherung Ihrer Daten","it":"Backup dei tuoi dati","pt":"Cópia de segurança dos seus dados","es":"Copia de seguridad de tus datos","sv":"Säkerhetskopia av dina data","no":"Sikkerhetskopi av dataene dine","fi":"Tietojesi varmuuskopio"},"homecoon.prem0":{"fr":"Objets et lieux illimités","en":"Unlimited items and places","de":"Unbegrenzt Objekte und Orte","it":"Oggetti e luoghi illimitati","pt":"Objetos e locais ilimitados","es":"Objetos y lugares ilimitados","sv":"Obegränsat med föremål och platser","no":"Ubegrenset med gjenstander og steder","fi":"Rajattomasti esineitä ja paikkoja"},"homecoon.prem1":{"fr":"Sauvegarde chiffrée par phrase de passe","en":"Backup encrypted with a passphrase","de":"Mit Passphrase verschlüsselte Sicherung","it":"Backup cifrato con frase segreta","pt":"Cópia cifrada com frase-passe","es":"Copia cifrada con frase de contraseña","sv":"Säkerhetskopia krypterad med lösenfras","no":"Sikkerhetskopi kryptert med passfrase","fi":"Salalauseella salattu varmuuskopio"},"homecoon.prem2":{"fr":"Exports Excel, CSV, JSON et PDF — réimportables","en":"Excel, CSV, JSON and PDF exports — re-importable","de":"Export nach Excel, CSV, JSON und PDF — reimportierbar","it":"Esportazioni Excel, CSV, JSON e PDF — reimportabili","pt":"Exportações Excel, CSV, JSON e PDF — reimportáveis","es":"Exportaciones Excel, CSV, JSON y PDF — reimportables","sv":"Export till Excel, CSV, JSON och PDF — kan importeras tillbaka","no":"Eksport til Excel, CSV, JSON og PDF — kan importeres tilbake","fi":"Vienti Exceliin, CSV-, JSON- ja PDF-muotoon — tuotavissa takaisin"},"safecoon.genre":{"fr":"Coffre-fort numérique","en":"Digital safe","de":"Digitaler Tresor","it":"Cassaforte digitale","pt":"Cofre digital","es":"Caja fuerte digital","sv":"Digitalt kassaskåp","no":"Digitalt pengeskap","fi":"Digitaalinen kassakaappi"},"safecoon.desc":{"fr":"Photographiez une facture : SafeCoon la comprend, la <b>chiffre sur votre appareil</b> et la classe. Des années plus tard, « la garantie de ma perceuse ? » suffit à la retrouver. Personne d'autre ne peut ouvrir votre coffre — nous non plus.","en":"Photograph an invoice: SafeCoon understands it, <b>encrypts it on your device</b> and files it. Years later, “what's the warranty on my drill?” is enough to find it. Nobody else can open your safe — not even us.","de":"Fotografieren Sie eine Rechnung: SafeCoon versteht sie, <b>verschlüsselt sie auf Ihrem Gerät</b> und ordnet sie ein. Jahre später genügt „Wie lange läuft die Garantie meiner Bohrmaschine?“. Niemand sonst kann Ihren Tresor öffnen — wir auch nicht.","it":"Fotografa una fattura: SafeCoon la capisce, la <b>cifra sul tuo dispositivo</b> e la archivia. Anni dopo basta « la garanzia del mio trapano? » per ritrovarla. Nessun altro può aprire la tua cassaforte — noi compresi.","pt":"Fotografe uma fatura: o SafeCoon percebe-a, <b>cifra-a no seu dispositivo</b> e arquiva-a. Anos depois, « a garantia do meu berbequim? » basta para a encontrar. Mais ninguém pode abrir o seu cofre — nós também não.","es":"Fotografía una factura: SafeCoon la entiende, la <b>cifra en tu dispositivo</b> y la archiva. Años después, « ¿la garantía de mi taladro? » basta para encontrarla. Nadie más puede abrir tu caja fuerte — nosotros tampoco.","sv":"Fotografera en faktura: SafeCoon förstår den, <b>krypterar den på din enhet</b> och sorterar in den. År senare räcker ”garantin på min borrmaskin?” för att hitta den. Ingen annan kan öppna ditt kassaskåp — inte vi heller.","no":"Fotografer en faktura: SafeCoon forstår den, <b>krypterer den på enheten din</b> og arkiverer den. År senere holder det med «garantien på drillen min?». Ingen andre kan åpne pengeskapet ditt — heller ikke vi.","fi":"Kuvaa lasku: SafeCoon ymmärtää sen, <b>salaa sen laitteessasi</b> ja arkistoi sen. Vuosia myöhemmin riittää ”porakoneeni takuu?”. Kukaan muu ei voi avata kassakaappiasi — emme mekään."},"safecoon.free0":{"fr":"50 documents","en":"50 documents","de":"50 Dokumente","it":"50 documenti","pt":"50 documentos","es":"50 documentos","sv":"50 dokument","no":"50 dokumenter","fi":"50 asiakirjaa"},"safecoon.free1":{"fr":"Scanner, garanties, rappels, étiquettes QR","en":"Scanner, warranties, reminders, QR labels","de":"Scanner, Garantien, Erinnerungen, QR-Etiketten","it":"Scanner, garanzie, promemoria, etichette QR","pt":"Digitalizador, garantias, lembretes, etiquetas QR","es":"Escáner, garantías, avisos, etiquetas QR","sv":"Skanner, garantier, påminnelser, QR-etiketter","no":"Skanner, garantier, påminnelser, QR-etiketter","fi":"Skanneri, takuut, muistutukset, QR-tarrat"},"safecoon.prem0":{"fr":"Documents illimités","en":"Unlimited documents","de":"Unbegrenzt viele Dokumente","it" >garder</b> : enregistrer vos lectures, tenir un journal, suivre des dossiers dans la durée et exporter votre travail. Un achat unique, à vie, sans abonnement.","en":"These four apps can be explored freely. The full version is there to <b>keep</b>: save your readings, keep a journal, follow records over time and export your work. A single purchase, for life, no subscription.","de":"Diese vier Apps können frei erkundet werden. Die Vollversion dient zum <b>Behalten</b>: Lesungen speichern, ein Journal führen, Akten langfristig verfolgen und Ihre Arbeit exportieren. Einmaliger Kauf, lebenslang, kein Abo.","it":"Queste quattro app si scoprono liberamente. La versione completa serve a <b>conservare</b>: salvare le letture, tenere un diario, seguire i dossier nel tempo ed esportare il vostro lavoro. Acquisto unico, a vita, senza abbonamento.","pt":"Estas quatro aplicações descobrem-se livremente. A versão completa serve para <b>guardar</b>: gravar as suas leituras, manter um diário, acompanhar processos ao longo do tempo e exportar o seu trabalho. Compra única, vitalícia, sem subscrição.","es":"Estas cuatro aplicaciones se descubren libremente. La versión completa sirve para <b>guardar</b>: registrar sus lecturas, llevar un diario, seguir expedientes en el tiempo y exportar su trabajo. Una compra única, de por vida, sin suscripción.","sv":"Dessa fyra appar kan utforskas fritt. Fullversionen finns för att <b>spara</b>: bevara dina avläsningar, föra dagbok, följa ärenden över tid och exportera ditt arbete. Ett engångsköp, för livet, utan abonnemang.","no":"Disse fire appene kan utforskes fritt. Fullversjonen er der for å <b>beholde</b>: lagre avlesningene dine, føre dagbok, følge saker over tid og eksportere arbeidet ditt. Et engangskjøp, for livet, uten abonnement.","fi":"Näihin neljään sovellukseen voi tutustua vapaasti. Täysversio on <b>säilyttämistä</b> varten: tallenna lukemasi, pidä päiväkirjaa, seuraa asiakirjoja ajan mittaan ja vie työsi ulos. Kertaosto, elinikäinen, ei tilausta."},"sec.all.h":{"fr":"Tout-en-un","en":"All-in-one","de":"Alles in einem","it":"Tutto in uno","pt":"Tudo-em-um","es":"Todo en uno","sv":"Allt-i-ett","no":"Alt-i-ett","fi":"Kaikki yhdessä"},"sec.all.s":{"fr":"Le même socle, réuni dans une seule application — en cours de développement.","en":"The same foundation, brought together in a single app — in development.","de":"Dieselbe Grundlage, in einer einzigen App vereint — in Entwicklung.","it":"La stessa base, riunita in una sola app — in sviluppo.","pt":"A mesma base, reunida numa única aplicação — em desenvolvimento.","es":"La misma base, reunida en una sola aplicación — en desarrollo.","sv":"Samma grund, samlad i en enda app — under utveckling.","no":"Samme grunnlag, samlet i én app — under utvikling.","fi":"Sama perusta yhdessä sovelluksessa — kehitteillä."},"tag.free":{"fr":"Gratuit","en":"Free","de":"Kostenlos","it":"Gratis","pt":"Gratuito","es":"Gratis","sv":"Gratis","no":"Gratis","fi":"Ilmainen"},"tag.life":{"fr":"à vie","en":"for life","de":"lebenslang","it":"a vita","pt":"vitalício","es":"de por vida","sv":"för livet","no":"for livet","fi":"elinikäinen"},"tag.soon":{"fr":"En développement","en":"In development","de":"In Entwicklung","it":"In sviluppo","pt":"Em desenvolvimento","es":"En desarrollo","sv":"Under utveckling","no":"Under utvikling","fi":"Kehitteillä"},"col.free":{"fr":"Gratuitement","en":"Free of charge","de":"Kostenlos","it":"Gratuitamente","pt":"Gratuitamente","es":"Gratuitamente","sv":"Utan kostnad","no":"Uten kostnad","fi":"Ilmaiseksi"},"col.prem":{"fr":"Avec la version complète","en":"With the full version","de":"Mit der Vollversion","it":"Con la versione completa","pt":"Com a versão completa","es":"Con la versión completa","sv":"Med fullversionen","no":"Med fullversjonen","fi":"Täysversiolla"},"go":{"fr":"Voir la page de {app} →","en":"See the {app} page →","de":"Zur {app}-Seite →","it":"Vedi la pagina di {app} →","pt":"Ver a página de {app} →","es":"Ver la página de {app} →","sv":"Se sidan för {app} →","no":"Se siden for {app} →","fi":"Katso {app}-sivu →"},"note":{"fr":"<b>Comment ça marche.</b> Sur Google Play et l'App Store, la version complète s'obtient par achat intégré. Pour l'APK téléchargé hors store, vous payez par PayPal ou SumUp depuis la page de l'application et recevez une licence nominative par email, à coller dans les réglages — débloquée à vie et hors ligne, elle survit aux mises à jour.","en":"<b>How it works.</b> On Google Play and the App Store, the full version is unlocked by in-app purchase. For the APK downloaded outside the stores, you pay by PayPal or SumUp from the app's page and receive a personal licence by email, to paste into the settings — unlocked for life and offline, it survives updates.","de":"<b>So funktioniert es.</b> Bei Google Play und im App Store wird die Vollversion per In-App-Kauf freigeschaltet. Für die außerhalb der Stores heruntergeladene APK zahlen Sie per PayPal oder SumUp auf der Seite der App und erhalten per E-Mail eine persönliche Lizenz, die Sie in den Einstellungen einfügen — lebenslang und offline freigeschaltet, sie übersteht Updates.","it":"<b>Come funziona.</b> Su Google Play e App Store la versione completa si ottiene con acquisto in-app. Per l'APK scaricato fuori dagli store, pagate con PayPal o SumUp dalla pagina dell'app e ricevete per email una licenza nominativa da incollare nelle impostazioni — sbloccata a vita e offline, sopravvive agli aggiornamenti.","pt":"<b>Como funciona.</b> No Google Play e na App Store, a versão completa obtém-se por compra integrada. Para o APK descarregado fora das lojas, paga por PayPal ou SumUp na página da aplicação e recebe uma licença nominativa por email, para colar nas definições — desbloqueada para sempre e offline, sobrevive às atualizações.","es":"<b>Cómo funciona.</b> En Google Play y la App Store, la versión completa se obtiene por compra integrada. Para el APK descargado fuera de las tiendas, paga con PayPal o SumUp desde la página de la aplicación y recibe una licencia nominativa por correo, para pegarla en los ajustes — desbloqueada de por vida y sin conexión, sobrevive a las actualizaciones.","sv":"<b>Så fungerar det.</b> På Google Play och App Store låses fullversionen upp med köp i appen. För APK-filen som laddas ner utanför butikerna betalar du med PayPal eller SumUp från appens sida och får en personlig licens via e-post att klistra in i inställningarna — upplåst för livet och offline, den överlever uppdateringar.","no":"<b>Slik fungerer det.</b> På Google Play og App Store låses fullversjonen opp med kjøp i appen. For APK-en som lastes ned utenfor butikkene betaler du med PayPal eller SumUp fra appens side og får en personlig lisens på e-post, som limes inn i innstillingene — låst opp for livet og offline, den overlever oppdateringer.","fi":"<b>Näin se toimii.</b> Google Playssä ja App Storessa täysversio avataan sovelluksen sisäisellä ostolla. Kauppojen ulkopuolelta ladatun APK:n osalta maksat PayPalilla tai SumUpilla sovelluksen sivulta ja saat sähköpostitse henkilökohtaisen lisenssin, jonka liität asetuksiin — avattu elinikäisesti ja offline, se säilyy päivitysten yli."},"foot.brand":{"fr":"<b>Bengacoon</b> — applications de bien-être et de suivi · © 2026","en":"<b>Bengacoon</b> — wellbeing and tracking apps · © 2026","de":"<b>Bengacoon</b> — Apps für Wohlbefinden und Verlaufskontrolle · © 2026","it":"<b>Bengacoon</b> — app di benessere e monitoraggio · © 2026","pt":"<b>Bengacoon</b> — aplicações de bem-estar e acompanhamento · © 2026","es":"<b>Bengacoon</b> — aplicaciones de bienestar y seguimiento · © 2026","sv":"<b>Bengacoon</b> — appar för välbefinnande och uppföljning · © 2026","no":"<b>Bengacoon</b> — apper for velvære og oppfølging · © 2026","fi":"<b>Bengacoon</b> — hyvinvointi- ja seurantasovellukset · © 2026"},"foot.disc":{"fr":"Les applications Bengacoon sont des applications de bien-être. Les approches présentées le sont comme des traditions de bien-être : elles n'établissent aucun diagnostic, ne constituent pas un traitement et ne remplacent pas l'avis d'un professionnel de santé. Lifecoon est un carnet de suivi personnel et ne fournit aucun conseil médical.","en":"Bengacoon apps are wellbeing apps. The approaches presented are wellbeing traditions: they make no diagnosis, are not a treatment and do not replace the advice of a health professional. Lifecoon is a personal tracking notebook and provides no medical advice.","de":"Bengacoon-Apps sind Wellness-Apps. Die vorgestellten Ansätze sind Traditionen des Wohlbefindens: Sie stellen keine Diagnose, sind keine Behandlung und ersetzen nicht den Rat einer medizinischen Fachkraft. Lifecoon ist ein persönliches Tagebuch und gibt keine medizinischen Ratschläge.","it":"Le app Bengacoon sono app di benessere. Gli approcci presentati sono tradizioni di benessere: non formulano diagnosi, non costituiscono un trattamento e non sostituiscono il parere di un professionista sanitario. Lifecoon è un diario personale e non fornisce consigli medici.","pt":"As aplicações Bengacoon são aplicações de bem-estar. As abordagens apresentadas são tradições de bem-estar: não estabelecem qualquer diagnóstico, não constituem tratamento e não substituem a opinião de um profissional de saúde. Lifecoon é um caderno de acompanhamento pessoal e não fornece aconselhamento médico.","es":"Las aplicaciones Bengacoon son aplicaciones de bienestar. Los enfoques presentados son tradiciones de bienestar: no establecen ningún diagnóstico, no constituyen un tratamiento y no sustituyen la opinión de un profesional sanitario. Lifecoon es un cuaderno de seguimiento personal y no ofrece consejo médico.","sv":"Bengacoon-apparna är appar för välbefinnande. De metoder som presenteras är traditioner för välbefinnande: de ställer ingen diagnos, utgör ingen behandling och ersätter inte råd från vårdpersonal. Lifecoon är en personlig anteckningsbok och ger inga medicinska råd.","no":"Bengacoon-appene er apper for velvære. Tilnærmingene som presenteres er velværetradisjoner: de stiller ingen diagnose, er ingen behandling og erstatter ikke råd fra helsepersonell. Lifecoon er en personlig loggbok og gir ingen medisinske råd.","fi":"Bengacoon-sovellukset ovat hyvinvointisovelluksia. Esitellyt lähestymistavat ovat hyvinvoinnin perinteitä: ne eivät tee diagnoosia, eivät ole hoitoa eivätkä korvaa terveydenhuollon ammattilaisen neuvoa. Lifecoon on henkilökohtainen seurantavihko eikä anna lääketieteellisiä neuvoja."},"numerocoon.genre":{"fr":"Numérologie & astrologie","en":"Numerology & astrology","de":"Numerologie & Astrologie","it":"Numerologia e astrologia","pt":"Numerologia e astrologia","es":"Numerología y astrología","sv":"Numerologi & astrologi","no":"Numerologi & astrologi","fi":"Numerologia ja astrologia"},"numerocoon.desc":{"fr":"Votre thème numérologique détaillé — chemin de vie, expression, âme, défis, cycles — et votre ascendant calculé depuis votre heure de naissance. Horoscope du jour et de la semaine, compatibilité et guidance. Entièrement gratuit, en 9 langues.","en":"Your detailed numerology chart — life path, expression, soul, challenges, cycles — and your rising sign calculated from your birth time. Daily and weekly horoscope, compatibility and guidance. Completely free, in 9 languages.","de":"Ihr detailliertes numerologisches Profil — Lebensweg, Ausdruck, Seele, Herausforderungen, Zyklen — und Ihr Aszendent, berechnet aus Ihrer Geburtszeit. Tages- und Wochenhoroskop, Kompatibilität und Führung. Völlig kostenlos, in 9 Sprachen.","it":"Il vostro tema numerologico dettagliato — cammino di vita, espressione, anima, sfide, cicli — e il vostro ascendente calcolato dall'ora di nascita. Oroscopo del giorno e della settimana, compatibilità e guida. Del tutto gratuito, in 9 lingue.","pt":"O seu tema numerológico detalhado — caminho de vida, expressão, alma, desafios, ciclos — e o seu ascendente calculado a partir da hora de nascimento. Horóscopo diário e semanal, compatibilidade e orientação. Totalmente gratuito, em 9 idiomas.","es":"Su tema numerológico detallado — camino de vida, expresión, alma, desafíos, ciclos — y su ascendente calculado desde su hora de nacimiento. Horóscopo del día y de la semana, compatibilidad y guía. Totalmente gratis, en 9 idiomas.","sv":"Ditt detaljerade numerologiska diagram — livsväg, uttryck, själ, utmaningar, cykler — och ditt ascendenttecken beräknat från din födelsetid. Dags- och veckohoroskop, kompatibilitet och vägledning. Helt gratis, på 9 språk.","no":"Ditt detaljerte numerologiske kart — livsvei, uttrykk, sjel, utfordringer, sykluser — og ditt ascendanttegn beregnet fra fødselstidspunktet. Dags- og ukehoroskop, kompatibilitet og veiledning. Helt gratis, på 9 språk.","fi":"Yksityiskohtainen numerologinen karttasi — elämänpolku, ilmaisu, sielu, haasteet, syklit — ja nousumerkkisi laskettuna syntymäajastasi. Päivä- ja viikkohoroskooppi, yhteensopivuus ja opastus. Täysin ilmainen, 9 kielellä."},"respicoon.genre":{"fr":"Respiration","en":"Breathing","de":"Atmung","it":"Respirazione","pt":"Respiração","es":"Respiración","sv":"Andning","no":"Pust","fi":"Hengitys"},"respicoon.desc":{"fr":"17 séances de cohérence cardiaque et de respiration guidée, portées par un souffle animé et de vraies ambiances sonores. Créez vos propres programmes et suivez vos séries, en douceur.","en":"17 sessions of cardiac coherence and guided breathing, carried by an animated breath and real soundscapes. Create your own programmes and follow your streaks, gently.","de":"17 Sitzungen für Herzkohärenz und geführtes Atmen, getragen von einem animierten Atem und echten Klangkulissen. Erstellen Sie eigene Programme und verfolgen Sie Ihre Serien, ganz sanft.","it":"17 sessioni di coerenza cardiaca e respirazione guidata, sostenute da un respiro animato e da vere atmosfere sonore. Create i vostri programmi e seguite le vostre serie, con dolcezza.","pt":"17 sessões de coerência cardíaca e respiração guiada, com uma respiração animada e verdadeiros ambientes sonoros. Crie os seus próprios programas e acompanhe as suas séries, com suavidade.","es":"17 sesiones de coherencia cardíaca y respiración guiada, con una respiración animada y verdaderos ambientes sonoros. Cree sus propios programas y siga sus rachas, con suavidad.","sv":"17 pass med hjärtkoherens och guidad andning, burna av en animerad andning och riktiga ljudmiljöer. Skapa egna program och följ dina serier, varsamt.","no":"17 økter med hjertekoherens og guidet pust, båret av en animert pust og ekte lydmiljøer. Lag dine egne programmer og følg seriene dine, skånsomt.","fi":"17 sydämen koherenssin ja ohjatun hengityksen istuntoa, mukanaan animoitu hengitys ja aidot äänimaisemat. Luo omat ohjelmasi ja seuraa putkiasi, lempeästi."},"fitcoon.genre":{"fr":"Musculation & cardio","en":"Strength & cardio","de":"Krafttraining & Cardio","it":"Pesi e cardio","pt":"Musculação e cardio","es":"Musculación y cardio","sv":"Styrka & kondition","no":"Styrke & kondisjon","fi":"Voima ja kestävyys"},"fitcoon.desc":{"fr":"Votre carnet d'entraînement : un coach qui génère la séance du jour, plus de 160 exercices animés avec les muscles travaillés, des programmes, le suivi des records et le mode salle. Sans pub, sans abonnement.","en":"Your training log: a coach that generates the day's session, over 160 animated exercises showing the muscles worked, programmes, record tracking and a gym mode. No ads, no subscription.","de":"Ihr Trainingstagebuch: ein Coach, der die Einheit des Tages erstellt, über 160 animierte Übungen mit den beanspruchten Muskeln, Programme, Rekordverfolgung und Studio-Modus. Ohne Werbung, ohne Abo.","it":"Il vostro diario di allenamento: un coach che genera la seduta del giorno, oltre 160 esercizi animati con i muscoli coinvolti, programmi, monitoraggio dei record e modalità palestra. Senza pubblicità, senza abbonamento.","pt":"O seu caderno de treino: um treinador que gera a sessão do dia, mais de 160 exercícios animados com os músculos trabalhados, programas, registo de recordes e modo ginásio. Sem publicidade, sem subscrição.","es":"Su cuaderno de entrenamiento: un entrenador que genera la sesión del día, más de 160 ejercicios animados con los músculos trabajados, programas, seguimiento de récords y modo gimnasio. Sin publicidad, sin suscripción.","sv":"Din träningsdagbok: en coach som skapar dagens pass, över 160 animerade övningar med musklerna som tränas, program, rekorduppföljning och gymläge. Inga annonser, inget abonnemang.","no":"Din treningsdagbok: en coach som lager dagens økt, over 160 animerte øvelser med musklene som trenes, programmer, rekordoppfølging og treningsstudio-modus. Ingen reklame, ingen abonnement.","fi":"Harjoituspäiväkirjasi: valmentaja luo päivän treenin, yli 160 animoitua liikettä työskentelevine lihaksineen, ohjelmat, ennätysten seuranta ja salitila. Ei mainoksia, ei tilausta."},"lifecoon.genre":{"fr":"Suivi santé","en":"Health tracking","de":"Gesundheits-Tracking","it":"Monitoraggio salute","pt":"Acompanhamento de saúde","es":"Seguimiento de salud","sv":"Hälsouppföljning","no":"Helseoppfølging","fi":"Terveysseuranta"},"lifecoon.desc":{"fr":"Tension, glycémie, poids, traitements, ordonnances et rendez-vous, réunis dans un carnet clair pensé pour les patients chroniques, les seniors et les aidants. Un rapport PDF prêt pour votre médecin, et tout reste chiffré sur l'appareil.","en":"Blood pressure, blood sugar, weight, treatments, prescriptions and appointments, gathered in a clear notebook designed for people with chronic conditions, seniors and carers. A PDF report ready for your doctor, and everything stays encrypted on the device.","de":"Blutdruck, Blutzucker, Gewicht, Behandlungen, Rezepte und Termine in einem übersichtlichen Heft für chronisch Kranke, Senioren und Pflegende. Ein PDF-Bericht für Ihre Ärztin oder Ihren Arzt, und alles bleibt verschlüsselt auf dem Gerät.","it":"Pressione, glicemia, peso, terapie, ricette e appuntamenti, riuniti in un quaderno chiaro pensato per i malati cronic ie Ihre Steine im richtigen Moment.","it":"Una guida completa alla litoterapia: ogni pietra con le sue proprietà, le associazioni e le precauzioni. Componete bracciali su misura, seguite la luna e purificate le pietre al momento giusto.","pt":"Um guia completo de litoterapia: cada pedra com as suas propriedades, associações e precauções. Componha pulseiras à medida, siga a lua e purifique as suas pedras no momento certo.","es":"Una guía completa de litoterapia: cada piedra con sus propiedades, asociaciones y precauciones. Componga pulseras a medida, siga la luna y purifique sus piedras en el momento adecuado.","sv":"En komplett kristallguide: varje sten med egenskaper, kombinationer och försiktighetsåtgärder. Sätt ihop egna armband, följ månen och rena dina stenar vid rätt tillfälle.","no":"En komplett steinguide: hver stein med egenskaper, kombinasjoner og forholdsregler. Sett sammen egne armbånd, følg månen og rens steinene til rett tid.","fi":"Kattava kiviopas: jokainen kivi ominaisuuksineen, yhdistelmineen ja varotoimineen. Kokoa räätälöityjä rannekoruja, seuraa kuuta ja puhdista kivesi oikeaan aikaan."},"oraclecoon.genre":{"fr":"Oracle & introspection","en":"Oracle & introspection","de":"Orakel & Innenschau","it":"Oracolo e introspezione","pt":"Oráculo e introspeção","es":"Oráculo e introspección","sv":"Orakel & självreflektion","no":"Orakel & selvrefleksjon","fi":"Oraakkeli ja itsetutkiskelu"},"oraclecoon.desc":{"fr":"Un oracle d'animaux totems pour l'introspection : tirez une carte, lisez le message de votre animal, explorez ses chakras et notez ce qu'il éveille en vous, jour après jour.","en":"A totem animal oracle for introspection: draw a card, read your animal's message, explore its chakras and note what it stirs in you, day after day.","de":"Ein Krafttier-Orakel zur Innenschau: ziehen Sie eine Karte, lesen Sie die Botschaft Ihres Tieres, erkunden Sie seine Chakren und notieren Sie, was es in Ihnen weckt, Tag für Tag.","it":"Un oracolo di animali totem pe
